# Основные настройки MinecraftRPG.
# Почти всё (зоны, NPC, мобы, оружие) настраивается в игре, здесь только переключатели модулей.

# Префикс сообщений (формат MiniMessage: https://docs.advntr.dev/minimessage/format.html)
prefix: "<gold>[RPG]</gold> "

modules:
  health: true       # своё ХП и броня без ванильных пределов (2000 ХП, 1000 брони). false — ванильные ХП, броня из /create-item не действует
  regions: true      # защита мира, зоны строительства и добычи (/create-region)
  tree-replant: true # автопосадка деревьев после сруба
  npc: true          # NPC: торговцы и квестодатели (/create-npc)
  dialogs: true      # диалоги с NPC
  quests: true       # квесты (/create-quest, /quests)
  mobs: true         # кастомные мобы
  items: true        # кастомные предметы и оружие (/create-item)
  hud: true          # цифры урона, ХП цели сверху экрана, боковая панель справа
  levels: true       # уровни персонажа: опыт за мобов и квесты, уровни у мобов и предметов (/level)
  mana: true         # мана персонажа для способностей, +мана на броне (/mana)
  menu: true         # главное меню игрока: /menu, компас в хотбаре, окно персонажа /stats
  abilities: true    # способности: руны в хотбаре, полёт, прыжок, рывок, телепорт и т.д. (/create-ability, /abilities)

storage:
  # Пока только yaml. Позже можно добавить sqlite.
  type: yaml

items:
  # Во сколько раз крит. удар сильнее обычного
  crit-multiplier: 1.5

health:
  # Своё ХП и броня вместо ванильных: у игрока и моба может быть сколько угодно ХП и брони.
  # Сердца игрока (и ванильное ХП моба) показывают долю: 1000 из 2000 ХП = 5 сердец из 10.
  # Точные числа: над хотбаром у игрока, в полоске сверху экрана у цели.
  # ХП игрока без брони (как в ванилле — 20). Бонусы брони из /create-item добавляются к нему.
  player-base: 20
  # Снижение урона бронёй = броня / (броня + armor-constant).
  # При 100: 50 брони = 33%, 100 = 50%, 300 = 75%, 900 = 90%. Больше число — броня слабее.
  armor-constant: 100
  # Больше этой доли (%) броня урон не снижает
  max-armor-reduction: 90
  # Урон от окружения (падение, огонь, лава, утопление, голод, яд, взрыв TNT) — доля от максимума ХП,
  # как в ванилле: падение на 4 из 20 ХП у игрока с 2000 ХП снимет 400. false — ванильные числа.
  scale-environment-damage: true
  # То же для ванильного лечения: еда, зелья, золотое яблоко
  scale-vanilla-healing: true
  # Показывать своё ХП, броню и ману над хотбаром, когда ХП меняется
  show-in-action-bar: true

levels:
  # Уровни персонажа. Игрок начинает с 1-го. Опыт дают убийства кастомных мобов и квесты.
  # Последний уровень. Опыт на нём больше не копится.
  max-level: 20
  # Сколько опыта нужно с уровня N на N+1: xp-base × N ^ xp-exponent (округляется).
  # При 100 и 1.5: 1→2 = 100, 5→6 = 1118, 10→11 = 3162, 19→20 = 8282, всего до 20-го ≈ 67 000.
  xp-base: 100
  xp-exponent: 1.5
  # Своя таблица вместо формулы: первое число — опыт с 1-го на 2-й уровень, второе — со 2-го на 3-й и т.д.
  # Если чисел меньше, чем уровней, последнее повторяется. Пусто — формула выше.
  xp-table: []
  # Опыт за моба, если в /create-mob стоит «авто»: mob-xp-per-level × уровень моба × множитель ранга.
  # При 10: обычный моб 5-го уровня — 50 опыта, элитный — 150, босс — 500.
  mob-xp-per-level: 10
  tier-xp-multiplier:
    elite: 3
    boss: 10
  penalty:
    # Если моб на столько уровней (или больше) выше или ниже игрока, опыта за него меньше
    level-difference: 5
    # Сколько процентов опыта остаётся в этом случае (0 — совсем без опыта)
    xp-percent: 25
  # Обычные (не из /create-mob) мобы дают свой ванильный опыт как опыт персонажа
  vanilla-mob-xp: false
  # +ХП к максимуму игрока за каждый уровень после первого (на 20-м уровне при 5: +95 ХП). 0 — без прибавки.
  health-per-level: 5
  # Полностью вылечить игрока при новом уровне
  heal-on-level-up: true
  # Ванильная полоска опыта показывает уровень персонажа (цифра) и опыт до следующего (полоска).
  # Ванильный опыт (сферы, бутылочки, руда) тогда не начисляется, уровень не теряется при смерти.
  use-xp-bar: true
  # Пока полоска показывает уровень, стол зачарования не работает (уровни на нём тратились бы бесплатно)
  block-enchanting: true
  # Показывать уровень перед ником в списке игроков (Tab): [5] Steve
  show-in-tab: true

hud:
  # Всплывающие цифры урона над целью
  damage-numbers: true
  # Название и ХП существа сверху экрана, когда на него смотришь
  target-health: true
  # Дальность, на которой видно ХП цели (в блоках)
  target-range: 20
  sidebar:
    # Боковая панель справа экрана: уровень, ХП, мана, текущий квест. Игрок может скрыть её в /menu → Настройки.
    # На Bedrock справа от строк видны числа (клиент рисует их всегда), в Java они скрыты.
    enabled: true
    # Заголовок панели (MiniMessage)
    title: "<gold><bold>Персонаж"
    # Нижняя строка панели, например адрес сервера. Пусто — без неё.
    footer: ""
    # Как часто обновлять панель (в тиках, 20 = 1 секунда)
    update-ticks: 10

mana:
  # Мана персонажа: тратится на способности. Хранится у игрока, переживает рестарт.
  # Максимум маны на 1-м уровне
  base: 100
  # +мана к максимуму за каждый уровень после первого (на 20-м уровне при 10: 100 + 190 = 290)
  per-level: 10
  # Сколько маны восстанавливается в секунду (броня из /create-item может добавить)
  regen: 2
  # Полная мана после возрождения
  fill-on-respawn: true

abilities:
  # Способности создаются в игре: /create-ability. Игрок применяет их ПКМ руной в руке.
  # ЛКМ руной тоже применяет способность. На Bedrock «использовать» в воздухе срабатывает не для всех
  # предметов, поэтому лучше оставить true.
  cast-on-left-click: true
  # Высасывание жизни и обмен здоровьем действуют на других игроков (ещё нужен pvp=true в мире).
  affect-players: true
  # Сколько секунд плавного падения после короткого полёта (0 — без него, урона от падения всё равно нет)
  flight-slow-fall: 4
  # Миры, где способности не работают, например [world_nether]
  disabled-worlds: []

quests:
  # Повторяемые квесты (/create-quest → квест → «Повторение»).
  # Ежедневные квесты и доска заданий обновляются каждый день в это время (ЧЧ:ММ).
  daily-reset: "00:00"
  # Еженедельные квесты обновляются в этот день недели (по-английски: MONDAY ... SUNDAY) в daily-reset.
  weekly-reset-day: MONDAY
  # Часовой пояс для сброса, например Europe/Moscow. Пусто — часовой пояс сервера.
  timezone: ""
  board:
    # Сколько случайных квестов из пула доска заданий показывает каждый день (1-27)
    daily-count: 3

menu:
  # Компас в хотбаре открывает /menu (на Bedrock удобнее команды). Его нельзя выбросить или переложить,
  # при смерти он не выпадает. Игрок может убрать его в /menu → Настройки.
  compass: true
  # Слот хотбара для компаса, 1-9
  compass-slot: 9

spawning:
  # Запретить естественный спавн монстров (в темноте, ночью, фантомы, патрули, подкрепления).
  # Мобы из яиц, команд, спавнеров и кастомные мобы плагина всё равно появляются.
  block-natural-monsters: true
  # То же для животных (коровы, свиньи и т.д.)
  block-natural-animals: false

mobs:
  # Кастомные мобы стоят на месте спавна и только оглядываются. Если моб отошёл от места спавна дальше
  # этого радиуса (блоки), он бросает цель и бежит обратно.
  leash-radius: 25
  # Враждебный моб (переключатель в меню моба) сам нападает на игрока, которого видит в этом радиусе.
  # Невраждебный нападает только в ответ на удар.
  aggro-range: 16
  # Скорость возврата на место спавна (1 — обычный шаг моба)
  return-speed: 1.3

npc:
  # NPC поворачивают голову к ближайшему игроку в этом радиусе (блоки). 0 — не поворачиваться.
  look-at-players: 8

regions:
  # Защита мира: игроки без права rpg.region.bypass (по умолчанию все, кроме OP) не ломают, не ставят
  # и не открывают блоки. Исключения настраиваются в /create-region: зоны строительства и зоны добычи.
  protect-world: true
  # В каких мирах действует защита. Пустой список — во всех.
  worlds: []
  # Разрешить открывать деревянные двери, люки, калитки и нажимать кнопки вне зон строительства
  allow-doors: true
  # Какими блоками можно пользоваться вне зон строительства (названия по-английски)
  allowed-blocks:
    - CRAFTING_TABLE
    - ENCHANTING_TABLE
    - ANVIL
    - CHIPPED_ANVIL
    - DAMAGED_ANVIL
    - GRINDSTONE
    - SMITHING_TABLE
    - STONECUTTER
    - LOOM
    - CARTOGRAPHY_TABLE
    - ENDER_CHEST
  # Взрывы (криперы, TNT) не ломают блоки вне зон строительства
  block-explosions: true
  # Огонь не распространяется и не сжигает блоки вне зон строительства
  block-fire: true
  # Эндермены, разорители, чешуйницы, иссушители и зомби (двери) не трогают блоки вне зон строительства
  block-mob-griefing: true
  # В зонах добычи листва не осыпается, пока брёвна ждут возврата
  keep-leaves-in-mining-zones: true
  # Добыча из зон добычи падает сразу в инвентарь (и опыт тоже)
  drops-to-inventory: true
  # Писать игроку «Здесь нельзя ломать» над хотбаром
  deny-messages: true

plots:
  # Участки игроков на землях под участки (/create-region → Земли под участки, у игроков /plot).
  # Сторона квадрата участка в блоках для каждой бумаги. Высота участка — всегда вся высота мира.
  # Лучше, чтобы большие размеры делились на малый (15, 30, 60): тогда места на карте ровно совпадают.
  size-small: 15
  size-medium: 30
  size-large: 60
  # Сколько участков может занять один игрок. 0 — сколько угодно.
  max-per-player: 0
  # Сколько помощников (кому можно строить) владелец может добавить на участок, до 9.
  max-members: 9
  # Когда игрок отказывается от участка, вернуть ему бумагу
  refund-deed-on-release: true
  # Кнопка «Телепорт на участок» в /plot для игроков (админ может всегда)
  allow-teleport: true
