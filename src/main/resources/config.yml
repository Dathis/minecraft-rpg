# Основные настройки MinecraftRPG.
# Почти всё (зоны, NPC, мобы, оружие) настраивается в игре, здесь только переключатели модулей.

# Префикс сообщений (формат MiniMessage: https://docs.advntr.dev/minimessage/format.html)
prefix: "<gold>[RPG]</gold> "

modules:
  health: true       # своё ХП и броня без ванильных пределов (2000 ХП, 1000 брони). false — ванильные ХП, броня из /create-item не действует
  regions: true      # защита мира, зоны строительства и добычи (/create-region)
  tree-replant: true # автопосадка деревьев после сруба
  npc: true          # NPC: торговцы и квестодатели (/create-npc)
  dialogs: true      # диалоги с NPC
  quests: true       # квесты (/create-quest, /quests)
  mobs: true         # кастомные мобы
  items: true        # кастомные предметы и оружие (/create-item)
  hud: true          # цифры урона и ХП цели сверху экрана

storage:
  # Пока только yaml. Позже можно добавить sqlite.
  type: yaml

items:
  # Во сколько раз крит. удар сильнее обычного
  crit-multiplier: 1.5

health:
  # Своё ХП и броня вместо ванильных: у игрока и моба может быть сколько угодно ХП и брони.
  # Сердца игрока (и ванильное ХП моба) показывают долю: 1000 из 2000 ХП = 5 сердец из 10.
  # Точные числа: над хотбаром у игрока, в полоске сверху экрана у цели.
  # ХП игрока без брони (как в ванилле — 20). Бонусы брони из /create-item добавляются к нему.
  player-base: 20
  # Снижение урона бронёй = броня / (броня + armor-constant).
  # При 100: 50 брони = 33%, 100 = 50%, 300 = 75%, 900 = 90%. Больше число — броня слабее.
  armor-constant: 100
  # Больше этой доли (%) броня урон не снижает
  max-armor-reduction: 90
  # Урон от окружения (падение, огонь, лава, утопление, голод, яд, взрыв TNT) — доля от максимума ХП,
  # как в ванилле: падение на 4 из 20 ХП у игрока с 2000 ХП снимет 400. false — ванильные числа.
  scale-environment-damage: true
  # То же для ванильного лечения: еда, зелья, золотое яблоко
  scale-vanilla-healing: true
  # Показывать своё ХП и броню над хотбаром, когда ХП меняется
  show-in-action-bar: true

hud:
  # Всплывающие цифры урона над целью
  damage-numbers: true
  # Название и ХП существа сверху экрана, когда на него смотришь
  target-health: true
  # Дальность, на которой видно ХП цели (в блоках)
  target-range: 20

spawning:
  # Запретить естественный спавн монстров (в темноте, ночью, фантомы, патрули, подкрепления).
  # Мобы из яиц, команд, спавнеров и кастомные мобы плагина всё равно появляются.
  block-natural-monsters: true
  # То же для животных (коровы, свиньи и т.д.)
  block-natural-animals: false

mobs:
  # Кастомные мобы стоят на месте спавна и только оглядываются. Если моб отошёл от места спавна дальше
  # этого радиуса (блоки), он бросает цель и бежит обратно.
  leash-radius: 25
  # Враждебный моб (переключатель в меню моба) сам нападает на игрока, которого видит в этом радиусе.
  # Невраждебный нападает только в ответ на удар.
  aggro-range: 16
  # Скорость возврата на место спавна (1 — обычный шаг моба)
  return-speed: 1.3

npc:
  # NPC поворачивают голову к ближайшему игроку в этом радиусе (блоки). 0 — не поворачиваться.
  look-at-players: 8

regions:
  # Защита мира: игроки без права rpg.region.bypass (по умолчанию все, кроме OP) не ломают, не ставят
  # и не открывают блоки. Исключения настраиваются в /create-region: зоны строительства и зоны добычи.
  protect-world: true
  # В каких мирах действует защита. Пустой список — во всех.
  worlds: []
  # Разрешить открывать деревянные двери, люки, калитки и нажимать кнопки вне зон строительства
  allow-doors: true
  # Какими блоками можно пользоваться вне зон строительства (названия по-английски)
  allowed-blocks:
    - CRAFTING_TABLE
    - ENCHANTING_TABLE
    - ANVIL
    - CHIPPED_ANVIL
    - DAMAGED_ANVIL
    - GRINDSTONE
    - SMITHING_TABLE
    - STONECUTTER
    - LOOM
    - CARTOGRAPHY_TABLE
    - ENDER_CHEST
  # Взрывы (криперы, TNT) не ломают блоки вне зон строительства
  block-explosions: true
  # Огонь не распространяется и не сжигает блоки вне зон строительства
  block-fire: true
  # Эндермены, разорители, чешуйницы, иссушители и зомби (двери) не трогают блоки вне зон строительства
  block-mob-griefing: true
  # В зонах добычи листва не осыпается, пока брёвна ждут возврата
  keep-leaves-in-mining-zones: true
  # Добыча из зон добычи падает сразу в инвентарь (и опыт тоже)
  drops-to-inventory: true
  # Писать игроку «Здесь нельзя ломать» над хотбаром
  deny-messages: true

plots:
  # Участки игроков на землях под участки (/create-region → Земли под участки, у игроков /plot).
  # Сторона квадрата участка в блоках для каждой бумаги. Высота участка — всегда вся высота мира.
  # Лучше, чтобы большие размеры делились на малый (15, 30, 60): тогда места на карте ровно совпадают.
  size-small: 15
  size-medium: 30
  size-large: 60
  # Сколько участков может занять один игрок. 0 — сколько угодно.
  max-per-player: 0
  # Сколько помощников (кому можно строить) владелец может добавить на участок, до 9.
  max-members: 9
  # Когда игрок отказывается от участка, вернуть ему бумагу
  refund-deed-on-release: true
  # Кнопка «Телепорт на участок» в /plot для игроков (админ может всегда)
  allow-teleport: true
