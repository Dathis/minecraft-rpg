name: MinecraftRPG
version: '${version}'
main: com.dathis.rpg.RpgPlugin
api-version: '1.21'
description: RPG-плагин для Paper с поддержкой Java и Bedrock (Geyser + Floodgate)
authors: [Dathis]
softdepend: [floodgate, Geyser-Spigot]

commands:
  rpg:
    description: Главная команда RPG-плагина
    usage: /rpg <help|modules|reload>
    permission: rpg.command
  create-item:
    description: Окно создания кастомных предметов и оружия
    usage: /create-item [list | give <id> [игрок]]
    aliases: [createitem, ci]
    permission: rpg.admin
  create-mob:
    description: Окно создания кастомных мобов
    usage: /create-mob [list | egg <id> [кол-во] [игрок] | spawn <id> | wand]
    aliases: [createmob, cm]
    permission: rpg.admin
  create-npc:
    description: Окно создания NPC (торговцы, квестодатели)
    usage: /create-npc [list | place <id> | remove]
    aliases: [createnpc, cnpc]
    permission: rpg.admin
  create-quest:
    description: Окно создания квестов
    usage: /create-quest [list | wand | reset <игрок> [id]]
    aliases: [createquest, cq]
    permission: rpg.admin
  create-region:
    description: Защита мира, зоны строительства, зоны добычи и земли под участки
    usage: /create-region [list | wand | deed <земля> <small|medium|large> [игрок]]
    aliases: [createregion, regions]
    permission: rpg.admin
  plot:
    description: Мои участки и выбор места по бумаге на участок
    usage: /plot [claim]
    aliases: [plots]
    permission: rpg.command
  quests:
    description: Журнал квестов игрока
    usage: /quests
    aliases: [q, journal]
    permission: rpg.command

permissions:
  rpg.command:
    description: Доступ к /rpg
    default: true
  rpg.admin:
    description: Администрирование RPG (зоны, NPC, мобы, оружие, магазины)
    default: op
    children:
      rpg.command: true
      rpg.region.bypass: true
  rpg.region.bypass:
    description: Ломать, строить и открывать блоки везде, несмотря на защиту мира
    default: op
